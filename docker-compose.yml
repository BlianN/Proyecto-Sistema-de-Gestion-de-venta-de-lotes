# Levantar todo:            docker compose up --build
# Recrear la base de cero:  docker compose down -v   y luego   docker compose up --build
# Con pgAdmin (opcional):   docker compose --profile herramientas up --build

services:
  db:
    image: postgres:16-alpine
    container_name: inmobiliaria_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inmobiliaria}
      POSTGRES_USER: ${POSTGRES_USER:-inmobiliaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inmobiliaria}
      TZ: America/Lima
      PGTZ: America/Lima
    ports:
      - "${DB_PORT:-5433}:5432"          # 5433 para no chocar con un PostgreSQL instalado en la PC
    volumes:
      # La primera vez que se crea la base, PostgreSQL ejecuta estos .sql en orden alfabético.
      - ./db:/docker-entrypoint-initdb.d:ro
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 40

  api:
    build: ./api
    container_name: inmobiliaria_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-inmobiliaria}:${POSTGRES_PASSWORD:-inmobiliaria}@db:5432/${POSTGRES_DB:-inmobiliaria}
      TZ: America/Lima
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api/app:/code/app              # los cambios en el código se recargan solos
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: inmobiliaria_pgadmin
    profiles: ["herramientas"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@inmobiliaria.pe
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  datos_pg:
